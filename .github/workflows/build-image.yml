name: Build Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build (${{ matrix.arch }})
    # Native runners for each arch — no QEMU. Public repo => free minutes,
    # including the new GitHub-hosted ARM64 runner pool.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Free disk space
        # ragflow's image is ~10 GB; GH-hosted runners ship with ~14 GB free
        # which is enough but tight. Removing pre-installed Android/dotnet
        # SDKs frees ~25 GB.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                       /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v6

      - name: Patch Dockerfile for build compatibility
        run: |
          # Ubuntu 24.04 base + msodbcsql18 (the 17 package is gone for noble)
          sed -i 's#packages.microsoft.com/config/ubuntu/22.04#packages.microsoft.com/config/ubuntu/24.04#g' Dockerfile
          sed -i 's#msodbcsql17#msodbcsql18#g' Dockerfile
          sed -i 's#curl https://packages.microsoft.com/keys/microsoft.asc | apt-key add -#curl -fsSL https://packages.microsoft.com/keys/microsoft.asc > /tmp/ms.asc \&\& gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg /tmp/ms.asc#g' Dockerfile
          sed -i 's#{ echo "Failed to install ODBC driver"; exit 1; }#{ echo "ODBC driver install skipped"; }#g' Dockerfile
          # Swap the Aliyun pypi mirror for the canonical one — Aliyun rate-
          # limits non-CN egress, GH-hosted runners are in the US/EU.
          sed -i 's|https://mirrors.aliyun.com/pypi/simple|https://pypi.org/simple|g' pyproject.toml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    name: Merge manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      primary_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  release:
    name: Tag release
    needs: merge
    # Only auto-tag on push to main. Tag pushes (refs/tags/v*) already carry
    # their own version and skip this job to avoid recursion.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        # Reads conventional-commit prefixes (feat:/fix:/etc.) to choose the
        # bump level; falls back to patch when none match. Tags created with
        # GITHUB_TOKEN do not re-trigger workflows, so no recursion.
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # `false` => only conventional-commit prefixes (feat:/fix:/etc.)
          # bump the version. Plain pushes are no-ops for releases.
          default_bump: false
          tag_prefix: v
          release_branches: main

      # Everything below only runs when a bump actually happened.
      - name: Set up Docker Buildx
        if: steps.tag.outputs.new_tag != ''
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.tag.outputs.new_tag != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag manifest with semver
        # imagetools create rewrites the manifest list under new tags
        # without pulling/rebuilding layers.
        if: steps.tag.outputs.new_tag != ''
        run: |
          NEW_VER="${{ steps.tag.outputs.new_version }}"   # e.g. 0.25.1
          MAJ_MIN="$(echo "$NEW_VER" | awk -F. '{print $1"."$2}')"
          SRC="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.merge.outputs.primary_tag }}"
          docker buildx imagetools create \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${NEW_VER}" \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${MAJ_MIN}" \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
            "$SRC"

      - name: Create GitHub Release
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          generate_release_notes: true
